services:
  llm-server:
    image: ghcr.io/ggml-org/llama.cpp:server # ARM64 supported, all libs included
    ports:
      - "8080:8080"
    volumes:
      - ./models:/models
      - ./logs:/logs
    environment:
      - HF_TOKEN=${HF_TOKEN}
      - LLAMA_ARG_HF_REPO=hasin023/gemma3_1b_400S_p77s16v20-GGUF
      - LLAMA_ARG_HF_FILE=gemma3-1b-ft-Q4_K_M.gguf ## gemma3-1b-ft-Q5_K_M.gguf, gemma3-1b-ft-Q8_0.gguf
      - LLAMA_CACHE=/models
      - LLAMA_ARG_HOST=0.0.0.0
      - LLAMA_ARG_PORT=8080
      # Threading - optimized for 2-core Orange Pi
      - LLAMA_ARG_THREADS=2 # Token generation threads (match CPU cores)
      - LLAMA_ARG_THREADS_BATCH=2 # Prompt processing threads (match CPU cores)
      - LLAMA_ARG_THREADS_HTTP=-1 # Auto-detect for HTTP handling
      # Parallel request slots - 2 is optimal for 2-core, can try 3-4
      - LLAMA_ARG_N_PARALLEL=2
      # Batching params - reduced for 2-core ARM device
      - LLAMA_ARG_BATCH=256 # Logical batch size (reduced for lower memory)
      - LLAMA_ARG_UBATCH=128 # Physical batch size (smaller = better latency)
      # Context size
      - LLAMA_ARG_CTX_SIZE=8192
      # Continuous batching (enabled by default, explicit for clarity)
      - LLAMA_ARG_CONT_BATCHING=true
      # === LOGGING & MONITORING ===
      - LLAMA_LOG_TIMESTAMPS=1 # Enable timestamps in logs
      - LLAMA_ARG_VERBOSE=1 # Enable verbose logging (prompts, responses)
      - LLAMA_LOG_VERBOSITY=20 # High verbosity for debugging
      - LLAMA_ARG_ENDPOINT_METRICS=1 # Enable Prometheus metrics endpoint
      - LLAMA_ARG_ENDPOINT_SLOTS=1 # Enable Slots endpoint for utilizing tracking
      - LLAMA_LOG_FILE=/logs/server.log # CORRECT ENV VAR for log file
      # Model behavior
      - LLAMA_ARG_CHAT_TEMPLATE=gemma
      - LLAMA_ARG_N_PREDICT=-1
      - LLAMA_ARG_TOP_K=20
      - LLAMA_ARG_TOP_P=0.8
      - LLAMA_ARG_MIN_P=0.05
      - LLAMA_ARG_TEMP=0.4
      - LLAMA_ARG_REPEAT_PENALTY=1.1
      # Performance optimizations
      - LLAMA_ARG_NUMA=distribute
      - LLAMA_ARG_WARMUP=true
      - LLAMA_ARG_NO_WEBUI=true
      - LLAMA_ARG_SLEEP_IDLE_SECONDS=-1
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 1G

  monitor:
    image: python:3.9-slim
    volumes:
      - ./logs:/logs
      - ./monitor.py:/app/monitor.py
    working_dir: /app
    command: sh -c "pip install requests && python monitor.py"
    depends_on:
      - llm-server
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.2"
          memory: 128M

volumes:
  models:
  logs:
