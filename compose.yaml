services:
  llama-cpp-server:
    # ports:
    #   - "8080:8080" # Exposed only internally via Docker network
    healthcheck:
      # Check health endpoint - try multiple methods for compatibility
      test:
        [
          "CMD-SHELL",
          "wget --quiet --tries=1 --spider http://localhost:8080/health 2>/dev/null || curl -f http://localhost:8080/health >/dev/null 2>&1 || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s # Give it time to load the model

    # === MODE A: CPU ONLY (DEFAULT) ===
    # image: ghcr.io/ggml-org/llama.cpp:server # ARM64 supported, all libs included
    # build:
    #   context: .
    #   dockerfile: Dockerfile.server
    # deploy:
    #   resources:
    #     limits:
    #       cpus: "4"
    #       memory: 2G
    # ==================================

    # === MODE B: GPU ENABLED (Uncomment to enable) ===
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    # =================================================

    volumes:
      - ./models:/models
      - ./logs:/logs
    environment:
      - HF_TOKEN=${HF_TOKEN}
      - LLAMA_ARG_HF_REPO=${LLAMA_ARG_HF_REPO}
      - LLAMA_ARG_HF_FILE=${LLAMA_ARG_HF_FILE} ## e.g., gemma3-1b-ft-Q4_K_M.gguf, gemma3-1b-ft-Q5_K_M.gguf, gemma3-1b-ft-Q8_0.gguf
      - LLAMA_CACHE=/models

      # GPU Offloading (Uncomment for GPU Mode)
      - LLAMA_ARG_N_GPU_LAYERS=-1

      - LLAMA_ARG_HOST=0.0.0.0
      - LLAMA_ARG_PORT=${LLAMA_ARG_PORT}
      # Threading - optimized for 2-core Orange Pi
      - LLAMA_ARG_THREADS=4 # Token generation threads (match CPU cores)
      - LLAMA_ARG_THREADS_BATCH=4 # Prompt processing threads (match CPU cores)
      - LLAMA_ARG_THREADS_HTTP=-1 # Auto-detect for HTTP handling
      # Parallel request slots - 2 is optimal for 2-core, can try 3-4
      - LLAMA_ARG_N_PARALLEL=1
      # Batching params - reduced for 2-core ARM device
      - LLAMA_ARG_BATCH=512 # Logical batch size (reduced for lower memory)
      - LLAMA_ARG_UBATCH=256 # Physical batch size (smaller = better latency)
      # Context size
      - LLAMA_ARG_CTX_SIZE=8192
      # Continuous batching (enabled by default, explicit for clarity)
      - LLAMA_ARG_CONT_BATCHING=true
      # === LOGGING & MONITORING ===
      - LLAMA_LOG_TIMESTAMPS=1 # Enable timestamps in logs
      - LLAMA_ARG_VERBOSE=0 # Enable verbose logging (prompts, responses)
      - LLAMA_LOG_VERBOSITY=0 # High verbosity for debugging
      - LLAMA_ARG_ENDPOINT_METRICS=1 # Enable Prometheus metrics endpoint
      - LLAMA_ARG_ENDPOINT_SLOTS=1 # Enable Slots endpoint for utilizing tracking
      - LLAMA_LOG_FILE=/logs/llama_cpp_server.log # CORRECT ENV VAR for log file
      # Model behavior
      - LLAMA_ARG_CHAT_TEMPLATE=gemma
      - LLAMA_ARG_N_PREDICT=-1
      - LLAMA_ARG_TOP_K=10
      - LLAMA_ARG_TOP_P=0.8
      - LLAMA_ARG_MIN_P=0.05
      - LLAMA_ARG_TEMP=0.8
      - LLAMA_ARG_REPEAT_PENALTY=1.1
      # Performance optimizations
      - LLAMA_ARG_NUMA=distribute
      - LLAMA_ARG_WARMUP=true
      - LLAMA_ARG_NO_WEBUI=true
      - LLAMA_ARG_SLEEP_IDLE_SECONDS=-1
    restart: unless-stopped
    # Note: Deployment resources are defined in the MODE blocks above

  llm-service-api:
    build:
      context: .
      dockerfile: Dockerfile.llm_service
    # Ports removed for production security (accessed via Nginx)
    # ports:
    #   - "8000:8000"
    volumes:
      - ./logs:/logs
      - ./llm_service:/app
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - LLAMA_CPP_ENDPOINT=http://llama-cpp-server:8080/v1
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import requests; requests.get('http://localhost:8000/health').raise_for_status()",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    depends_on:
      llama-cpp-server:
        condition: service_healthy
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      llm-service-api:
        condition: service_started
    restart: unless-stopped

  warmup:
    image: python:3.12-slim
    volumes:
      - ./scripts/warmup.py:/app/warmup.py
    working_dir: /app
    command: sh -c "pip install --no-cache-dir requests && python warmup.py"
    depends_on:
      llama-cpp-server:
        condition: service_healthy
      llm-service-api:
        condition: service_started
    restart: "no" # One-shot: run once and exit
    deploy:
      resources:
        limits:
          cpus: "0.1"
          memory: 64M

volumes:
  models:
  logs:
